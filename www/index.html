<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0e0e12">
<title>MeuIPTV</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="boot-splash">
  <div class="boot-splash-inner">
    <img id="boot-logo" class="app-logo" alt="logo" style="display:none;">
    <div class="boot-logo-fallback app-name-label">Meu<span>IPTV</span></div>
    <div class="boot-spinner"></div>
  </div>
</div>

<div id="screen-login" class="screen active">
  <div class="login-shell">
    <div class="login-visual">
      <img class="app-logo" style="display:none;" alt="logo">
      <div class="login-logo-fallback app-name-label">Meu<span>IPTV</span></div>
    </div>
    <div class="login-card">
      <p class="login-sub">Entre com seu usuário e senha</p>
      <form id="login-form" autocomplete="off" novalidate>
        <div class="field">
          <label for="inp-user">Usuário</label>
          <input id="inp-user" type="text" placeholder="Informe o usuário" required>
        </div>
        <div class="field">
          <label for="inp-pass">Senha</label>
          <input id="inp-pass" type="password" placeholder="Informe a senha" required>
        </div>
        <button type="submit" id="btn-login" class="btn-primary">Entrar</button>
      </form>
      <div id="login-error" class="error-box" hidden></div>
      <div id="login-loading" class="loading-box" hidden>
        <div class="spinner"></div>
        <span>Conectando ao servidor...</span>
      </div>
    </div>
  </div>
</div>

<div id="screen-app" class="screen">
  <header id="topbar">
    <div class="brand app-name-label">Meu<span>IPTV</span></div>
    <div id="view-title" class="view-title">Início</div>
  </header>

  <main id="content">
    <section id="view-inicio"    class="view active"></section>
    <section id="view-canais"    class="view"></section>
    <section id="view-filmes"    class="view"></section>
    <section id="view-series"    class="view"></section>
    <section id="view-continuar" class="view"></section>
    <section id="view-favoritos" class="view"></section>
    <section id="view-pesquisa"  class="view"></section>
    <section id="view-config"    class="view"></section>
    <section id="view-serie-detail" class="view"></section>
  </main>

  <nav id="bottom-nav">
    <button class="nav-btn active" data-view="inicio"><span>🏠</span><small>Início</small></button>
    <button class="nav-btn" data-view="canais"><span>📺</span><small>Canais</small></button>
    <button class="nav-btn" data-view="filmes"><span>🎬</span><small>Filmes</small></button>
    <button class="nav-btn" data-view="series"><span>📽️</span><small>Séries</small></button>
    <button class="nav-btn" data-view="favoritos"><span>⭐</span><small>Favoritos</small></button>
    <button class="nav-btn" data-view="pesquisa"><span>🔍</span><small>Busca</small></button>
    <button class="nav-btn" data-view="config"><span>⚙️</span><small>Config</small></button>
  </nav>
</div>

<div id="player-overlay" class="overlay hidden">
  <div class="player-wrap">
    <div class="player-head">
      <button id="player-close" class="btn-close" aria-label="Voltar">←</button>
      <div id="player-title" class="player-title"></div>
      <button id="player-fs" class="btn-close" aria-label="Tela cheia">⛶</button>
    </div>
    <div class="video-holder">
      <video id="video" controls playsinline preload="auto" crossorigin="anonymous"></video>
    </div>
    <div id="player-error" class="player-error" hidden></div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/config-loader.js"></script>
<script src="js/storage.js"></script>
<script src="js/api.js"></script>
<script src="js/player.js"></script>
<script src="js/backhandler.js"></script>
<script src="js/app.js"></script>
</body>
</html>
