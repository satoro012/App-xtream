name: Build APK

on:
  workflow_dispatch:
    inputs:
      tenant_id:
        description: 'Tenant ID do cliente (deixe vazio para usar o do repositorio)'
        required: false
        default: ''
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Sobrescrever TENANT_ID (build sob demanda)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.tenant_id != '' }}
        run: |
          sed -i "s/const TENANT_ID = \".*\";/const TENANT_ID = \"${{ inputs.tenant_id }}\";/" www/js/config.js
          echo "TENANT_ID usado neste build: ${{ inputs.tenant_id }}"
          grep TENANT_ID www/js/config.js

      - name: Adicionar/sincronizar projeto Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Dar permissão ao gradlew
        run: chmod +x android/gradlew

      - name: Compilar APK (debug)
        run: cd android && ./gradlew assembleRelease --no-daemon

      - name: Publicar APK gerado
        uses: actions/upload-artifact@v4
        with:
          name: MeuIPTV-debug-apk
          path: android/app/build/outputs/apk/debug/app-release.apk
